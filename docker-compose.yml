version: '3.8'

# Optional: a local Postgres for development. Skip this if you use a free Neon database.
services:
  postgres:
    image: postgres:15-alpine
    container_name: abeddy_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: abeddy_assistant
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
